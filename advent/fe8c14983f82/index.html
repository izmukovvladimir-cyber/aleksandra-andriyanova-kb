<style>

#cal .box.now:before{display:none}
.box.opening .lid{animation:lidoff .7s ease-out forwards}
@keyframes lidoff{to{transform:translateY(-90px) rotate(-28deg);opacity:0}}
.box.opening{animation:open 1.3s ease-in forwards}
@keyframes open{0%{transform:scale(1) rotate(0)}12%{transform:scale(1.15) rotate(-8deg)}24%{transform:scale(1.15) rotate(8deg)}36%{transform:scale(1.2) rotate(0)}

.prog{margin:18px 4px 4px}.pl{font:500 15px Manrope;color:var(--muted);text-align:center}.pl b{color:var(--accent-d)}

.inday .cover{display:none}.inday .brand{margin-top:40px}

<script>(function(){var s=document.querySelector('.snow');if(!s)return;for(var i=0;i<26;i++){var f=document.createElement('div');
f.className='flake';f.textContent=i%3?'❄':'✦';f.style.left=Math.random()*100+'vw';f.style.fontSize=(8+Math.random()*12)+'px';
f.style.opacity=.35+Math.random()*.5;f.style.animationDuration=(9+Math.random()*12)+'s';f.style.animationDelay=(-Math.random()*20)+'s';s.appendChild(f)}})();(function(){var g=document.querySelector('.glow');if(!g)return;for(var i=0;i<22;i++){var b=document.createElement('i');var s=6+Math.random()*16;
b.style.width=b.style.height=s+'px';b.style.left=Math.random()*100+'vw';b.style.top=Math.random()*100+'vh';b.style.animationDelay=(-Math.random()*3)+'s';
b.style.opacity=.3+Math.random()*.5;g.appendChild(b)}})();function startApp(){
let burst=()=>{};const DAY=30, KEYDAY=[[1, "Наши желания на этот месяц"], [9, "Наш ритуал встречи"], [12, "Наше стоп-слово"], [24, "Наши общие мечты"], [25, "Что хотим изменить и что сохранить"], [26, "Наше правило по деньгам"], [29, "Наш договор пары"]], GIFT=0, ALL=31;
let db;const op=indexedDB.open('advent-dvoih',1);
op.onupgradeneeded=e=>{e.target.result.createObjectStore('kv')};
op.onsuccess=e=>{db=e.target.result;init()};
function put(k,v){return new Promise(r=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r})}
function get(k){return new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result)})}
async function init(){
  for(const id of ['he','she','key']){const el=document.getElementById(id);if(!el)continue;
    el.value=(await get(DAY+':'+id))||'';let tm;el.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(async()=>{
      await put(DAY+':'+id,el.value);flash();check()},400)})}
  const ph=await get(DAY+':photo');if(ph)showPhoto(ph);
  for(const b of document.querySelectorAll('.star')){const k=DAY+':'+b.dataset.w+'*';const set=v=>{b.classList.toggle('on',!!v);b.textContent=(v?'★ В карте пары':'☆ В карту пары')};
    set(await get(k));b.addEventListener('click',async()=>{const v=!(await get(k));await put(k,v?1:0);set(v)})}
  let n=0;for(const b of document.querySelectorAll('#cal .box[data-d]')){const d=b.dataset.d;if(await get(d+':done')){b.classList.add('done');n++}
    const p=await get(d+':photo');if(p){b.classList.add('hasph');b.querySelector('.ph').style.backgroundImage='url('+p+')'}}
  prog(n);WAS=!!(await get(DAY+':done'));check();
  PREV_OK=DAY===1||TEAM||!!(await get((DAY-1)+':done'))||WAS;
  if(!(await get('welcomed'))){document.getElementById('cal').hidden=true;document.getElementById('welcome').hidden=false}
}
let WAS=false;const TEAM=new URLSearchParams(location.search).has('team');let PREV_OK=DAY===1;
function prog(n){document.getElementById('pn').textContent=n;setTimeout(()=>document.getElementById('pb').style.width=(n/31*100)+'%',300)}
function toast(t){const s=document.createElement('div');s.className='toast';s.textContent=t;document.body.appendChild(s);
  requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('on')));setTimeout(()=>{s.classList.remove('on');setTimeout(()=>s.remove(),500)},2600)}
function flash(){const s=document.getElementById('saved');s.textContent='Сохранено на этом телефоне';setTimeout(()=>s.textContent='',1800)}
async function check(){const he=(await get(DAY+':he'))||'',she=(await get(DAY+':she'))||'';
  if(he.trim()&&she.trim()){await put(DAY+':done',1);const b=document.querySelector('.box.now');if(b)b.classList.add('done');
    if(!WAS){WAS=true;const c=document.createElement('div');c.style.cssText='position:fixed;left:50%;top:45%;width:1px;height:1px';document.body.appendChild(c);
      burst(c);setTimeout(()=>burst(c),350);setTimeout(()=>c.remove(),2000);toast('Ура! День '+DAY+' пройден вместе 🎉');
      let m=0;for(const x of document.querySelectorAll('#cal .box.done'))m++;prog(m)}
    const g=document.getElementById('gift');if(g){g.classList.add('open');document.getElementById('giftlock').classList.add('hide')}}}
function showPhoto(src){const p=document.getElementById('photoprev');p.innerHTML='<img alt="Фото дня" src="'+src+'">'}
document.getElementById('file').addEventListener('change',ev=>{const f=ev.target.files[0];if(!f)return;const im=new Image();
  im.onload=async()=>{const k=Math.min(1,1080/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const d=c.toDataURL('image/jpeg',.82);await put(DAY+':photo',d);showPhoto(d);flash()};im.src=URL.createObjectURL(f)});
// карта пары (день 31)
function wrap(x,t,X,Y,W,lh,max){const words=(t||'').replace(/\s+/g,' ').trim().split(' ');let line='',n=0;
